name: Build iOS IPA (Unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project CardioPaceRun.xcodeproj \
            -scheme CardioPaceRun \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CardioPaceRun.app Payload/
          zip -r CardioPaceRun.ipa Payload
          ls -lh CardioPaceRun.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardioPaceRun-IPA
          path: CardioPaceRun.ipa
          retention-days: 30
