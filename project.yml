name: CardioPaceRun
options:
  bundleIdPrefix: com.cardiopacerun
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: it

targets:
  CardioPaceRun:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CardioPaceRun
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cardiopacerun.app
        PRODUCT_NAME: CardioPaceRun
        INFOPLIST_KEY_CFBundleDisplayName: CardioPaceRun
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: CardioPaceRun/Info.plist
      properties:
        CFBundleDisplayName: CardioPaceRun
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: "CardioPaceRun utilizza il Bluetooth per collegarsi alla tua fascia cardio (es. iGPSPORT HR50) e leggere i battiti in tempo reale anche a schermo bloccato."
        NSBluetoothPeripheralUsageDescription: "CardioPaceRun utilizza il Bluetooth per collegarsi alla tua fascia cardio."
        NSLocationWhenInUseUsageDescription: "CardioPaceRun utilizza il GPS per tracciare il percorso, la distanza e il passo durante la corsa."
        NSLocationAlwaysAndWhenInUseUsageDescription: "CardioPaceRun utilizza il GPS in background per continuare a tracciare la corsa e fornire gli avvisi vocali anche a schermo bloccato."
